<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좌석 예약 시스템</title>
    <style>
        .seat {
            width: 50px;
            height: 50px;
            background-color: #ccc;
            display: inline-block;
            margin: 5px;
            text-align: center;
            line-height: 50px;
        }
        .reserved {
            background-color: red;
        }
        .my-reservation {
            background-color: blue;
        }
        #class-name {
            display: block;
            margin: 20px auto;
            text-align: center;
            font-size: 20px;
        }
        .seat-container {
            text-align: center;
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <label for="class-name">수업 이름:</label>
        <input type="text" id="class-name">
    </div>

    <div id="seats" class="seat-container">
        <!-- 좌석들이 여기에 정적으로 생성될 것입니다. -->
        <div class="seat">1</div>
        <div class="seat">2</div>
        <div class="seat reserved">3</div>
        <div class="seat">4</div>
        <div class="seat">5</div>
        <div class="seat my-reservation">6</div>
        <div class="seat">7</div>
        <div class="seat">8</div>
        <div class="seat reserved">9</div>
        <div class="seat">10</div>
        <div class="seat">11</div>
        <div class="seat">12</div>
        <div class="seat">13</div>
        <div class="seat">14</div>
        <div class="seat">15</div>
        <div class="seat">16</div>
        <div class="seat">17</div>
        <div class="seat">18</div>
        <div class="seat reserved">19</div>
        <div class="seat">20</div>
        <div class="seat">21</div>
        <div class="seat">22</div>
        <div class="seat">23</div>
        <div class="seat">24</div>
        <div class="seat">25</div>
        <div class="seat">26</div>
        <div class="seat">27</div>
        <div class="seat">28</div>
        <div class="seat reserved">29</div>
        <div class="seat">30</div>
    </div>

    <div style="text-align: center;">
        <button id="reserve-button">예약</button>
        <button id="change-seat-button">자리 변경</button>
    </div>
</body>
</html>
